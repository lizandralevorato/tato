{% extends "base.html" %}
{% block titulo %}Excluir comunicado{% endblock %}
{% block conteudo %}
<h1>Excluir este comunicado?</h1>
<div class="cartao cartao--destaque"><p class="destaque-grande">{{ comunicado.titulo }}</p></div>
<p>Ele some para todas as pessoas. Para só esconder, edite e desmarque Publicado.</p>
<form method="post">
  {% csrf_token %}
  <div class="acoes">
    <button type="submit" class="botao botao--perigo botao--grande">Sim, excluir</button>
    <a class="botao botao--secundario botao--grande" href="{% url 'comunicados:gerenciar' %}">Não, manter</a>
  </div>
</form>
{% endblock %}
